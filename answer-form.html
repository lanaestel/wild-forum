<!--Отправка сообщений ctrl+entr-->
<script type="text/javascript">
  document.onkeydown = function (e) {
    if (e) event = e;
    if (event.keyCode == 13 && event.ctrlKey) {
      document.getElementById("post").submit.click();
      document.getElementById("post").reset();
    }
  };
</script>

<!--- Тег [block] в форме ответа © max, the murderer! -->

<script type="text/javascript">
  if (GroupID <= 2) {
    FORUM.set("editor.addition.tags.block", {
      name: "Кастомный блок",
      class_name: function () {
        return prompt("Введите класс", "myclass");
      },
      onclick: function () {
        var blockClass;
        (blockClass = FORUM.get("editor.addition.tags.block.class_name()"))
          ? bbcode("[block=" + blockClass + "]", "[/block]")
          : bbcode("");
      },
    });
  }
</script>

<!--- Простенький счетчик символов в Форму Ответа-->
<script>
  var a,
    L,
    epl = $("#main-reply"),
    str = '<small id="plng" style="">Написано символов: <b>00</b> </small>';
  epl.parents("fieldset").find("legend").prepend(str);
  function epl3() {
    a = epl.val().length;
    if (a > 9) {
      L = "";
    } else {
      L = "0";
    }
    $("#plng b").text(L + a);
  }
  epl3();
  $(".pl-quote").click(function () {
    setTimeout("epl3()", 100);
  });
  epl.bind("mouseout mousemove keydown keypress keyup", function (e) {
    epl3();
  });
</script>

<!----------- обтекание изображения + тег абзаца by vatueil ------------>
<script>
  // требуется кастомный тег float[/data-float]:a
  // используются иконки uicons
  $("#button-link").before(
    `<td id="button-float" title="Обтекание изображения" onclick='changeVisibility("float-area")'><img src="/i/blank.gif"></i></td>`
  );
  let floatContainer = `<div class="container" id="float-area" style="display:none" onclick='changeVisibility("float-area")'>
    <div><strong>Направление обтекания</strong></div>
    <div style="text-align: center; margin: .5rem 0 0;">
    <button type="button" class="float-button float-to-left" onclick="bbcode('[float=left]', '[/float]');return false;">
    <i class="fi fi-rr-arrow-alt-to-left"></i>
    </button>
    <button type="button" class="float-button float-to-right" onclick="bbcode('[float=right]', '[/float]');return false;">
    <i class="fi fi-rr-arrow-alt-to-right"></i>
    </button>    
    </div> 
    </div>`;
  $("#float-area .float-button").on("click", function () {
    $(this).parent().hide();
  });
  $("#keyboard-area").after(floatContainer);

  // требуется кастомный тег indent:si

  $("#button-strike").after(
    '<td id="button-indent" title="Отступы"><img src="/i/blank.gif"  onclick="smile(\'[indent]\')"></td>'
  );
</script>
