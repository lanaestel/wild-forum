<!-- Абсолютная ссылка по ПКМ копировать адрес ссылки на дату сообщения by Leraje -->
<script type="text/javascript">
  (function () {
    $("a.permalink").each(function () {
      let newLink = $(this).attr("href");
      let winHttp = document.URL.split(":")[0];
      let newLinkPtp =
        winHttp + "://" + location.hostname + "/viewtopic.php?pid=";
      let a = $(this).parents(".post").attr("id").replace(/^p/i, "");
      newLink = newLinkPtp + a + "#p" + a;

      $(this).contextmenu(function () {
        this.href = newLink;
      });
    });
  })();
</script>

<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const currentTopicId = Number(urlParams.get("id"));
    const silentQuoteTopics = [1826];
    const isSilent = silentQuoteTopics.includes(currentTopicId);

    // Переопределяем поведение кнопки цитирования
    if (isSilent) {
      // Находим все кнопки цитирования
      document
        .querySelectorAll("#pun-viewtopic .pl-quote > a")
        .forEach((link) => {
          link.addEventListener("click", function (event) {
            event.preventDefault();

            const postEl = this.closest(".post");
            let text;

            // Проверяем, выделил ли пользователь часть текста
            const selection = window.getSelection();
            if (
              selection &&
              selection.rangeCount > 0 &&
              postEl.contains(selection.anchorNode) &&
              postEl.contains(selection.focusNode)
            ) {
              text = selection.toString().trim();
            }

            // Если выделения нет — берём весь текст поста
            if (!text) {
              text = postEl.querySelector(".post-content").innerText.trim();
            }

            const textarea = document.querySelector("#main-reply");
            if (textarea) {
              textarea.value += `[block=silent-quote]${text}[/block]\n`;
              textarea.focus();
            }
          });
        });
    } else {
      // Обычная логика вставки ID в ссылку quote
      $("#pun-viewtopic .pl-quote>a").each(function () {
        $(this).attr(
          "href",
          $(this)
            .attr("href")
            .replace("('", "('#" + $(this).parents(".post").attr("id") + ",")
        );
      });
    }

    // cite внутри уже вставленных цитат
    $('.quote-box>cite:contains("#")').each(function () {
      const cntq = $(this).text();
      const pid = cntq.split(",")[0];
      const lnkq = '<a class="qc-post-link" href="';

      if (isSilent) {
        $(this).remove();
      } else {
        if ($(".post" + pid).length) {
          $(this).html(lnkq + pid + '">' + cntq.split(",")[1] + "</a>");
        } else {
          $(this).html(
            lnkq +
              "/viewtopic.php?pid=" +
              pid.split("#p")[1] +
              pid +
              '">' +
              cntq.split(",")[1] +
              "</a>"
          );
        }
      }
    });
  });
</script>

<div class="scroll-buttons hidden">
  <button class="scroll-button to-top" data-callback="scrollToTop">
    <i class="fi fi-rr-arrow-small-up"></i>
  </button>
  <button class="scroll-button to-bottom" data-callback="scrollToBottom">
    <i class="fi fi-rr-arrow-small-down"></i>
  </button>
</div>

<script>
  $(function () {
    var targetBottom = document.querySelector("#html-footer");
    var targetTop = document.querySelector("#pun-status");

    var scrollToTopBtn = document.querySelector(".scroll-button.to-top");
    var scrollToBottomBtn = document.querySelector(".scroll-button.to-bottom");
    var buttonsWrapper = document.querySelector(".scroll-buttons");
    var rootElement = document.documentElement;

    function callback(entries, observer) {
      entries.forEach((entry) => {
        let target = entry.target;
        if (targetBottom.isEqualNode(entry.target)) {
          if (entry.isIntersecting) {
            scrollToBottomBtn.classList.add("hidden");
          } else {
            scrollToBottomBtn.classList.remove("hidden");
          }
        }
        if (targetTop.isEqualNode(entry.target)) {
          if (entry.isIntersecting) {
            scrollToTopBtn.classList.add("hidden");
          } else {
            scrollToTopBtn.classList.remove("hidden");
          }
        }
      });
    }

    function scrollToTop() {
      rootElement.scrollTo({
        top: 0,
        behavior: "smooth",
      });
    }

    function scrollToBottom() {
      rootElement.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth",
      });
    }

    scrollToTopBtn.addEventListener("click", scrollToTop);
    scrollToBottomBtn.addEventListener("click", scrollToBottom);

    let observer = new IntersectionObserver(callback);
    observer.observe(targetBottom);
    observer.observe(targetTop);

    if (window.matchMedia("(max-device-width: 767px)").matches) {
      window.onscroll = function () {
        buttonsWrapper.classList.remove("hidden");
      };
      window.onscrollend = function () {
        setTimeout(() => {
          buttonsWrapper.classList.add("hidden");
        }, 1000);
      };
    } else {
      buttonsWrapper.classList.remove("hidden");
    }
  });
</script>
