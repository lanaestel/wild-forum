<!--Загрузка из файла акций и их перемешивание-->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    fetch("https://forumstatic.ru/files/001b/ec/ce/10680.html")
      .then((response) => response.arrayBuffer())
      .then((buffer) => {
        const decoder = new TextDecoder("windows-1251"); // или "utf-8" если нужно
        const html = decoder.decode(buffer);

        const container = document.querySelector(".act-content");
        container.innerHTML = html;

        // 🔁 После загрузки — перемешать и показать только 3
        const $block = $(container);
        const banners = $block
          .find("a")
          .toArray()
          .sort(() => Math.random() - 0.5);

        const visible = banners.slice(0, 3);
        const hidden = banners.slice(3);

        $block.empty();
        $(visible).appendTo($block).show();
        $(hidden).appendTo($block).hide();
        $block.removeClass("hidden");
      })
      .catch((error) => console.error("Ошибка загрузки акций:", error));
  });
</script>

<script type="text/javascript">
  var chfsize, chffam;
  if (!localStorage.fontsize) localStorage.setItem("fontsize", 13);
  if (!localStorage.fontfam) localStorage.setItem("fontfam", "0");
  chfsize = +localStorage.getItem("fontsize");
  chffam = localStorage.getItem("fontfam");
  function setfsize(f) {
    localStorage.setItem("fontsize", f);
    $(".fsize").text(f);
    $(".post-content > p, .silent-quote > p, blockquote > p").css(
      "font-size",
      f + "px"
    );
  }
  function setffam(f) {
    localStorage.setItem("fontfam", f);
    $("#chfontfam option").removeAttr("selected");
    $('#chfontfam option[value="' + f + '"]').attr("selected", "selected");
    if (f != "0")
      $(".post-content > p, .silent-quote > p, blockquote > p").css(
        "font-family",
        f
      );
    else
      $(".post-content > p, .silent-quote > p, blockquote > p").css(
        "font-family",
        ""
      );
  }
  $(".fsizeplus").on("click", function () {
    chfsize += 1;
    if (chfsize > 72) chfsize = 72;
    setfsize(chfsize);
  });
  $(".fsizeminus").on("click", function () {
    chfsize -= 1;
    if (chfsize < 6) chfsize = 6;
    setfsize(chfsize);
  });
  $("#chfontbut").on("click", function () {
    $("#chfont").toggleClass("active");
  });
  $("#chfontfam").on("change", function () {
    chffam = $(this).val();
    setffam(chffam);
  });
  $(document).pun_mainReady(function () {
    setfsize(chfsize);
    setffam(chffam);
  });
</script>
